name: "Ganache montée thé merveilleux"
description: "Ganache montée au chocolat blanc infusée au thé merveilleux"
source: "Version adaptée de la ganache montée au thé merveilleux de la recette « Pavlova poire et thé » de Gaetan Fiard, Fou de Pâtisserie n°74"
ingredients:
  - item: "4 g de pectine NH"
  - item: "8 g de sucre cristal"
  - item: "140 g de chocolat blanc vegan"
  - item: "312 g de crème végétale (1)"
  - item: "312 g de crème végétale (2)"
steps:
  - "Mélanger ensemble le sucre et la pectine et réserver"
  - "Porter à ébullition la crème végétale (1)"
  - "Hors du feu, faire infuser le thé pendant 10 minutes"
  - "Retirer le thé, remettre la crème à chauffer"
  - "Ajouter le mélange sucre/pectine à la crème et bien mélanger"
  - "Porter le tout à ébullition"
  - "Verser sur le chocolat blanc en morceau, laisser le fondre et mélanger le tout"
  - "Mélanger le tout"
  - "Ajouter la crème (2) froide et mélanger ou mixer le tout"
  - "Laisser reposer au frais pour au moins 6 à 8 heures"
  - "Une fois bien refroidie, monter la crème à l'aide d'un batteur"
