name: "Lemon curd"
category: insert
description: "Crème de citron onctueuse et acidulée"
source:
  title: "Perle en Sucre"
  url: "https://perleensucre.com/lemon-curd-ou-creme-au-citron-vegan/"
ingredients:
  - item: "150 ml de jus de citron"
  - item: "Le zeste de 2 citrons"
  - item: "90 ml de lait de soja (ou autre lait végétal)"
  - item: "110 g de sucre"
  - item: "15 g de fécule de maïs"
  - item: "Une pincée de curcuma en poudre (facultatif – pour la couleur)"
  - item: "60 g de margarine"
steps:
  - "Dans une casserole, mélanger le sucre, la fécule de maïs et le curcuma"
  - "Ajouter petit à petit le lait en mélangeant"
  - "Ajouter le jus de citron et les zestes"
  - "Faire cuire sur feu moyen en mélangeant continuellement, jusqu'à ce que la crème épaississe un peu"
  - "Porter à ébullition pour une minute, en continuant de mélanger"
  - "Retirer du feu"
  - "Ajouter la margarine puis mélanger jusqu'à ce que le mélange soit lisse et homogène"
  - "Pour un meilleur résultat, mixer le tout (si possible)"
  - "Verser dans un autre récipient et réserver au frais pour quelques heures"
