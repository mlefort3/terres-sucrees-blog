name: "Crème pâtissière au praliné"
category: mousse
description: "Crème pâtissière vanillée allégée au praliné amande/noisette"
source:
  title: "Perle en Sucre"
  url: "https://perleensucre.com/creme-patissiere-sans-oeufs-sans-lait-vegan/"
ingredients:
  - item: "500 ml de lait de soja à la vanille"
  - item: "Une gousse de vanille"
  - item: "80 g de sucre en poudre"
  - item: "50 g de fécule de maïs (ou autre fécule)"
  - item: "40 g de margarine (1)"
  - item: "200 g de margarine (2) (cela peut être réduit mais je n'ai pas essayé)"
  - item: "160 g de praliné amande/noisette"
steps:
  - "Faire chauffer le lait avec les grains de la gousse de vanille grattée, et la gousse entière"
  - "Porter à ébullition"
  - "Mettre hors du feu et laisser infuser pendant 20 min"
  - "Enlever la gousse de vanille"
  - "Dans un récipient, mélanger le sucre et la fécule de maïs"
  - "Ajouter le lait petit à petit, mélanger en même temps"
  - "Une fois le lait bien incorporé, remettre dans la casserole"
  - "Faire chauffer jusqu'à épaississement"
  - "Hors du feu, ajouter la margarine (1), laisser fondre et mélanger"
  - "Réserver au frais plusieurs heures"
  - "Une fois bien refroidie, bien mélanger pour rendre la crème plus souple"
  - "Ajouter la margarine (2) un peu fondue (en pommade) et le praliné"
  - "Bien mélanger jusqu'à obtenir un mélange homogène"
  - "Réserver"
