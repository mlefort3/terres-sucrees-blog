name: "Cannelés"
category: biscuit
description: "Cannelés vegan croustillants à l'extérieur et moelleux à l'intérieur"
notes: "Pour 8 cannelés."
ingredients:
  - item: "80 g de farine T55"
  - item: "10 g de fécule de maïs"
  - item: "200 g de sucre blanc"
  - item: "30 g de sucre de canne"
  - item: "300 g de lait de soja"
  - item: "100 g de crème végétale à 31% MG"
  - item: "30 g d’huile de tournesol"
  - item: "20 g de margarine végétale"
  - item: "40 g de rhum ambré"
  - item: "10 g d'extrait de vanille"
  - item: "1-2 gousse(s) de vanille"
  - item: "1 pincée de sel"
steps:
  - "Dans une casserole, verser le lait de soja, la crème végétale, les grains de la gousse de vanille grattée et la gousse de vanille."
  - "Porter doucement à ébullition, puis laisser infuser 20 minutes hors du feu."
  - "Retirer la gousse."
  - "Dans un saladier, mélanger la farine, les sucres, la fécule de maïs et la pincée de sel."
  - "Faire chauffer à nouveau le lait de soja et la crème végétale."
  - "Verser ce mélange en plusieurs fois sur vos poudres tout en mélangeant."
  - "Ajouter l'huile, la margarine fondue, le rhum, et l'extrait de vanille."
  - "Laisser reposer au frais 24 à 48 heures."
  - "Verser dans des moules graissés."
  - "Faire cuire 15 min à 250°C, puis 1h05 à 180°C."
  - "Démouler 20 min après cuisson."
