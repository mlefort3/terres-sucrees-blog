name: "Pâte à brownie"
description: "Pâte à brownie vegan au chocolat noir et à l'huile d'olive (pour un moule carré d'environ 20 x 20 cm)"
ingredients:
  - item: "90 g de margarine"
  - item: "45 g d'huile d'olive"
  - item: "75 g de chocolat noir (1)"
  - item: "80 g de cassonade"
  - item: "30 g de sucre blanc"
  - item: "25 g de sirop d'agave"
  - item: "100 g de yaourt de soja"
  - item: "1 c. à café d'extrait de vanille"
  - item: "1 pincée de sel"
  - item: "120 g de farine (T55)"
  - item: "20 g de fécule de maïs"
  - item: "25 g de cacao en poudre non sucré"
  - item: "2 g de levure chimique (ou poudre à lever)"
  - item: "75 g de morceaux de chocolat noir (2)"
  - item: "40 g de noisettes en morceaux"
steps:
  - "Si souhaité, faire torréfier les noisettes"
  - "Faire fondre la margarine avec le chocolat (1)"
  - "Hors du feu, ajouter l'huile d'olive et bien mélanger"
  - "Ajouter la cassonade, le sucre blanc et le sirop d'agave"
  - "Mélanger le tout à l'aide d'une maryse jusqu'à obtenir un mélange homogène"
  - "Ajouter le yaourt, la vanille, le sel et mélanger"
  - "Ajouter ensuite la farine, la fécule, le cacao, la levure et mélanger"
  - "Ajouter les morceaux de chocolat et de noisettes"
  - "Verser dans un moule chemisé de papier sulfurisé"
  - "Réserver"
