name: "Garniture tahini–dattes"
description: "Garniture à la pâte de dattes, au tahini et aux amandes"
ingredients:
  - item: "130 g de poudre d'amandes"
  - item: "1 c. à c. bombée de fécule de maïs"
  - item: "50 g de tahini"
  - item: "40 g de huile d’olive"
  - item: "70 g de dattes dénoyautées"
  - item: "30 g de lait végétal (1)"
  - item: "30 g de lait végétal (2)"
  - item: "60 g de sucre blond"
  - item: "1 c. à s. d'eau de fleur d’oranger"
  - item: "Zestes d'une petite orange"
  - item: "1 pincée de sel fin"
  - item: "1 c. à c. de cardamome (facultatif)"
steps:
  - "Réhydrater les dattes si nécessaire"
  - "Couper les dattes en morceaux"
  - "Les mixer avec 30 g de lait végétal (1) jusqu’à obtention d’une purée épaisse et lisse"
  - "Dans un saladier, mélanger la poudre d'amandes, la fécule, le sucre et le sel"
  - "Ajouter au saladier le tahini, l'huile d'olive et mélanger"
  - "Ajouter le lait végétal (2), l'eau de fleur d'oranger et les zestes d'orange"
  - "Ajouter la purée de dattes et bien mélanger"
  - "Laisser reposer 30 min au réfrigérateur"
