name: "Pâte sucrée cacao noisette"
category: pâte
description: "Pâte sucrée vegan au cacao et à la poudre de noisette"
source:
  title: "The Quaint Kitchen"
  url: "https://thequaintkitchen.com/fr/vegan-pate-sucree-shortcrust-pastry/"
ingredients:
  - item: "145 g de margarine"
  - item: "115 g de sucre glace"
  - item: "40 g de poudre de noisette"
  - item: "20 g de fécule de maïs"
  - item: "45 g de lait végétal"
  - item: "225 g de farine"
  - item: "25 g de cacao en poudre non sucré"
  - item: "1 pincée de sel"
steps:
  - "Dans un saladier, mélanger le beurre pour qu'il ait une texture assez souple"
  - "Ajouter le sel, la poudre de noisette, le sucre glace tamisé et bien mélanger"
  - "Ajouter la fécule de maïs, le lait et mélanger"
  - "Ajouter 100 g de farine et mélanger"
  - "Ajouter le reste de la farine et mélanger jusqu'à ce qu'une pâte commence à se former"
  - "Finir d'incorporer le mélange à la main, sans trop travailler la pâte mais jusqu'à ce qu'elle soit uniforme"
  - "Filmer la pâte, la laisser reposer au réfrigérateur au moins 1 h"
  - "Étaler la pâte et foncer dans votre moule ou cercle à tarte"
  - "Cuire 25 min à 180°C"
