name: "Croustillant chocolat blanc"
category: croustillant
description: "Couche croustillante au chocolat blanc et riz soufflé"
ingredients:
  - item: "30 g de chocolat blanc (vegan)"
  - item: "25 g de purée d'amandes"
  - item: "20 g de riz soufflé"
steps:
  - "Faire fondre le chocolat au bain marie"
  - "Ajouter le praliné et mélanger"
  - "Ajouter le riz soufflé et mélanger"
  - "Étaler sur la pâte cuite"
