name: "Crème d'amande"
description: "Crème d'amande vegan à la poudre d'amandes"
ingredients:
  - item: "90 g de margarine"
  - item: "75 g de sucre en poudre"
  - item: "85 g de yaourt de soja"
  - item: "110 g d'amandes en poudre"
  - item: "30 g de farine"
  - item: "2–3 gouttes d'arôme d'amande amère"
steps:
  - "Travailler la margarine pommade avec le sucre jusqu'à obtention d'une texture lisse"
  - "Ajouter le yaourt de soja et l'arôme, puis mélanger"
  - "Incorporer les amandes en poudre"
  - "Ajouter la farine et mélanger sans trop travailler la masse"
