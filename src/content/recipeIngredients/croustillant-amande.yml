name: "Croustillant amande"
description: "Couche croustillante à base de chocolat blanc et amandes"
ingredients:
  - item: "60 g de chocolat blanc vegan"
  - item: "50 g de purée d'amandes blanche ou complète"
  - item: "50 g de crêpes dentelles vegan"
  - item: "1 pincée de fleur de sel"
steps:
  - "Faire fondre le chocolat au bain marie"
  - "Ajouter la purée d'amandes et mélanger"
  - "Ajouter les crêpes dentelles, le sel et mélanger"
  - "Étaler sur le biscuit cuit"
