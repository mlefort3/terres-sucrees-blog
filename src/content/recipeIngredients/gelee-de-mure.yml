name: "Gelée de mûre"
description: "Gelée de mûre légèrement acidulée"
ingredients:
  - item: "150 g de purée de mûre"
  - item: "10 g de sucre"
  - item: "2 g de pectine"
  - item: "1 c. à café de jus de citron"
steps:
  - "Chauffer la purée de mûre"
  - "Mélanger le sucre et la pectine NH"
  - "Verser en pluie sur la purée chaude en mélangeant bien"
  - "Ajouter le jus de citron"
  - "Porter à ébullition pendant 1 à 2 minutes en remuant"
  - "Réserver et laisser refroidir"
