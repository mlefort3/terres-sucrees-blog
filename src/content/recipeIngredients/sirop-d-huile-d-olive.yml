name: "Sirop d'huile d'olive"
description: "Sirop d'huile d'olive pour imbiber la génoise"
ingredients:
  - item: "50 g de d'eau"
  - item: "50 g de sucre"
  - item: "25 g d'huile d'olive"
steps:
  - "Verser l'eau et le sucre dans une casserole"
  - "Laisser chauffer jusqu'à avoir la consistance d'un sirop"
  - "Ajouter l'huile d'olive"
  - "Mixer le mélange"
  - "Étaler sur la génoise"
