name: "Appareil à flan à la vanille"
description: "Appareil à flan vanille sans soja, crémeux et 100% végétal"
ingredients:
  - item: "400 g d'eau (1)"
  - item: "450 g de crème végétale Flora (ou autre crème > 30% de MG)"
  - item: "1 gousse de vanille"
  - item: "14 g de Yumgo jaune poudre"
  - item: "14 g d'huile"
  - item: "112 g d'eau (2)"
  - item: "120 g de sucre"
  - item: "65 g de fécule de maïs"
  - item: "20 g de fécule de pomme de terre"
  - item: "1 pincée de sel"
  - item: "11 g de margarine"
steps:
  - "Réhydrater le Yumgo jaune : yumgo jaune en poudre, eau (2), huile, et bien mélanger"
  - "Mélanger le Yumgo jaune réhydraté, le sucre, la fécule et le sel"
  - "Chauffer l'eau (1), la crème végétale, la gousse de vanille grattée et ses grains"
  - "Porter à ébullition"
  - "Éteindre le feu et laisser infuser la vanille 20 min (davantage si nécessaire)"
  - "Retirer la gousse de vanille, reporter le mélange à ébullition"
  - "Ajouter en trois fois ce mélange sur le mélange fécule/Yumgo"
  - "Reverser le tout dans la casserole et mettre à chauffer sur feu moyen"
  - "Mélanger en continu jusqu'à 1-2 min après épaississement"
  - "Ajouter la margarine"
  - "Mixer le tout au mixeur plongeant"
  - "Verser dans votre pâte précuite"
  - "Lisser le tout"
  - "Laisser reposer 1h à 2h au réfrigérateur"
  - "Cuire 40 min à 160°C"
