name: "Insert crémeux noisette"
category: insert
description: "Insert crémeux à la purée de noisettes"
ingredients:
  - item: "125 ml de lait végétal"
  - item: "75 ml de crème végétale"
  - item: "90 g de purée de noisettes"
  - item: "30 g de sucre"
  - item: "4 g de pectine NH"
  - item: "1 pincée de sel"
steps:
  - "Mélanger le sucre et la pectine"
  - "Mélanger le lait et la crème et faire chauffer"
  - "Lorsque le mélange se réchauffe, ajouter le mélange sucre/pectine et mélanger"
  - "Porter à ébullition pendant 1-2 min"
  - "Retirer du feu"
  - "Ajoute la purée de noisettes et le sel"
  - "Mixer le tout"
  - "Verser dans son moule à insert"
  - "Réserver au froid"
