name: "Cookies huile d'olive cardamome"
category: biscuit
description: "Cookies chocolat et amande à l'huile d'olive et à la cardamome"
ingredients:
  - item: "90 g d’huile d’olive"
  - item: "20 g de margarine végétale (optionnel)"
  - item: "120 g de sucre blond"
  - item: "45 g de yaourt de soja"
  - item: "15 g de fécule de maïs"
  - item: "230 g de farine de blé T55"
  - item: "1 c. à c. rase de poudre à lever"
  - item: "1/2 c. à c. de sel fin"
  - item: "1/2 à 1 c. à c. de cardamome verte moulue"
  - item: "1/2 c. à c. de cannelle (optionnel)"
  - item: "Zeste fin d’1/2 orange ou citron (facultatif)"
  - item: "140 g de chocolat noir"
  - item: "70 g d'amandes"
steps:
  - "Mélanger l’huile d’olive, la margarine et le sucre jusqu’à obtenir une texture homogène."
  - "Ajouter le yaourt de soja et la fécule de maïs, bien mélanger."
  - "Incorporer la cardamome, la cannelle et les zestes."
  - "Ajouter la farine, la poudre à lever et le sel. Mélanger sans trop travailler la pâte."
  - "Incorporer le chocolat noir et les amandes"
  - "Réserver la pâte au réfrigérateur pendant 30 à 45 minutes."
  - "Former des boules de pâte d’environ, les déposer sur une plaque et les aplatir un petit peu."
  - "Enfourner pour environ 15-20 min à 170 °C (chaleur statique)."
