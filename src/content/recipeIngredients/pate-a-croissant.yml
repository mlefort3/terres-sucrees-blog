name: "Pâte à croissant"
description: "Pâte à croissant feuilletée vegan au beurre de tourage végétal"
source:
  title: "latoque.fr"
  url: "https://www.latoque.fr/recettes/article/846261/croissant-xxl-de-philippe-conticini"
ingredients:
  - item: "312 g de farine T55"
  - item: "312 g de farine de gruau (ou farine T45 assez forte)"
  - item: "312 g de lait de soja"
  - item: "94 g de margarine"
  - item: "25 g de levure fraîche"
  - item: "87 g de sucre"
  - item: "14 g de sel"
  - item: "375 g de beurre de tourage végétal (j'utilise celui de la marque Be Better, je le trouve sur Végétal Food, où vous pouvez avoir -10% sur votre première commande avec le code TERRESSUCREES10)"
steps:
  - "Dans la cuve d'un robot, ajouter les farines."
  - "Ajouter d'un côté le sel, le sucre et la margarine en morceaux."
  - "D'un autre côté, ajouter la levure fraîche en morceaux."
  - "Ajouter le lait."
  - "Pétrir 6 min à vitesse minimum."
  - "Pétrir 14 min en 2ème vitesse."
  - "La pâte doit pouvoir s'étirer sans se casser. Si ce n'est pas le cas, remettre 2min et vérifier à nouveau jusqu'à obtention de la consistance souhaitée."
  - "Laisser 30 min à température ambiante, puis dégazer la pâte."
  - "Pendant ce temps là, étaler le beurre de tourage végétal dans un carré de papier sulfurisé d'environ 25x25 cm, puis laisser reposer au froid."
  - "Laisser refroidir la pâte à croissant dégazée 1h au réfrigérateur."
  - "Une fois la pâte et le beurre de tourage végétal refroidis, étaler la pâte sur un rectangle d'environ 50x25 cm (la pâte doit faire la même largeur que la pâte et 2x la longueur)."
  - "Enfermer le beurre dans la pâte (voir vidéo)."
  - "Filmer le tout et laisser refroidir 45min au réfrigérateur."
  - "Étaler la pâte dans le sens de la longueur (la pliure de la pâte étant à droite) pour une épaisseur assez fine et une longueur égale à 3x la largeur, et réaliser un tour double (voir vidéo)."
  - "Filmer le tout et laisser refroidir 45min au réfrigérateur."
  - "Étaler la pâte dans le sens de la longueur (la pliure de la pâte étant à droite) pour une épaisseur assez fine et une longueur égale à 2x la largeur, et réaliser un tour simple (voir vidéo)."
  - "Filmer le tout et laisser refroidir 2h au réfrigérateur avant utilisation."
