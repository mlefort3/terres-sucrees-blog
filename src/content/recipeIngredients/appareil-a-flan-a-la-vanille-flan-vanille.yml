name: "Appareil à flan à la vanille"
description: "Appareil à flan vanille crémeux, adapté en version végétale"
source:
  title: "William's Kitchen"
  url: "https://www.williamskitchenblog.com/post/flan-patissier"
ingredients:
  - item: "700 g de lait de soja"
  - item: "175 g de crème végétale liquide (au moins 30% de matières grasses)"
  - item: "160 g de Yumgo entier (22,4 g de Yumgo entier en poudre + 137,6 g d'eau pour réhydrater la poudre)"
  - item: "150 g de sucre"
  - item: "1 gousse de vanille"
  - item: "70 g de fécule de maïs"
  - item: "12 g de margarine fondue"
  - item: "1 pincée de sel"
steps:
  - "Dans une casserole, verser le lait de soja, la crème végétale, les grains de la gousse de vanille grattée et la gousse de vanille"
  - "Porter doucement à ébullition, puis laisser infuser 20 minutes hors du feu"
  - "Retirer la gousse"
  - "Dans un saladier, fouetter la fécule de maïs avec le sucre et le sel"
  - "Verser progressivement le mélange lait/crème/vanille sur les poudres tout en fouettant"
  - "Remettre le tout dans la casserole"
  - "Chauffer à feu moyen en fouettant constamment jusqu'à épaississement"
  - "Hors du feu, ajouter la margarine fondue, bien mélanger"
  - "Laisser tiédir quelques minutes, puis incorporer le Yumgo entier réhydraté"
  - "Verser l'appareil dans le moule (avec la pâte sucrée déjà mise en place)"
  - "Lisser la surface à la spatule"
  - "Enfourner à 180°C chaleur tournante, pendant 40 à 45 minutes"
  - "Arrêter lorsque le dessus est bien cuit et la pâte sucrée dorée"
  - "Laisser refroidir à température ambiante, puis réfrigérer au moins quelques heures"
