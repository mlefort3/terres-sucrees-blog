name: "Gelée mangue"
description: "Gelée de mangue légèrement citronnée"
ingredients:
  - item: "265 g de purée de mangue"
  - item: "30 g de sucre"
  - item: "4 g de pectine NH"
  - item: "1 cuillère à café de jus de citron"
steps:
  - "Mélanger le sucre et la pectine NH"
  - "Faire chauffer la purée de mangue"
  - "Ajouter le mélange sucre/pectine et le jus de citron"
  - "Porter à ébullition pour 1-2 min"
  - "Réserver"
