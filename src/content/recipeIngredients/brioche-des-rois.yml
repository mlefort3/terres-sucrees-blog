name: "Brioche des rois"
category: biscuit
description: "Brioche des rois vegan à la fleur d'oranger et à l'huile d'olive"
ingredients:
  - item: "350 g de farine T45"
  - item: "20 g de levure fraîche de boulanger"
  - item: "180 ml de lait de soja (1)"
  - item: "60 g de sucre en poudre"
  - item: "6 g de sel fin"
  - item: "40 g de beurre vegan ramolli"
  - item: "40 ml d'huile d'olive douce"
  - item: "25 ml d'eau de fleur d'oranger"
  - item: "Facultatif, si souhaité : zestes de citron et d'orange"
  - item: "Décoration : 2 cuillères à soupe de lait de soja (2)"
  - item: "Décoration : 1 cuillère à soupe de sirop d'agave"
  - item: "Décoration (facultatif) : sucre en grains"
  - item: "Décoration (facultatif) : fruits confits"
steps:
  - "Délayer la levure dans le lait de soja (1) tiède avec 1 cuillère à café de sucre"
  - "Laisser reposer 10 min"
  - "Dans la cuve du robot, ajouter la farine, le sucre, le sel (qui ne doit pas être en contact avec la levure) et les zestes (si souhaité)"
  - "Ajouter ensuite le mélange lait/levure, et l'eau de fleur d'oranger"
  - "Pétrir 5 min à vitesse moyenne"
  - "Ajouter le beurre vegan bien mou en plusieurs fois tout en continuant de pétrir"
  - "Ajouter l'huile d'olive petit à petit, tout en continuant de pétrir"
  - "Pétrir encore 10 min à vitesse moyenne, la pâte doit pouvoir se décoller des parois"
  - "Faire une boule avec la pâte et la couvrir"
  - "Faire lever la pâte 1h30 à 2h à température ambiante, ou une nuit au réfrigérateur"
  - "Après cette première pousse, dégazer la pâte en appuyant dessus"
  - "Faire un trou au centre et former la couronne"
  - "Cacher la fève !"
  - "Couvrir et laisser lever 1h"
  - "Mélanger le lait de soja (2) et le sirop d'agave"
  - "Dorer la brioche grâce à ce mélange et un pinceau"
  - "Si souhaité, ajouter le sucre en grains"
  - "Faire cuire environ 40 min à 170°C (chaleur statique), la brioche doit être bien dorée"
  - "Après cuisson et si souhaité, ajouter des fruits confits"
notes: "Alternative pour la décoration : il est possible d'ajouter le sucre en grains après cuisson. Pour cela, badigeonner la brioche d'un mélange de confiture de fruits (généralement abricot, ici framboise) et d'eau — pour 2 doses de confiture, comptez 1 dose d'eau."
