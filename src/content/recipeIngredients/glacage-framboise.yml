name: "Glaçage framboise"
description: "Glaçage brillant au chocolat blanc et à la framboise"
source: "Matteo Deiana (Giardino), Fou de Pâtisserie n°71, adapté à la framboise"
ingredients:
  - item: "200 g de chocolat blanc vegan"
  - item: "20 g de purée de framboises"
  - item: "20 g d’huile de pépins de raisins"
steps:
  - "Faire fondre le chocolat blanc au bain marie"
  - "Ajouter la purée de framboises et mélanger"
  - "Ajouter l’huile de pépins de raisins et mélanger"
  - "Verser à 35-40°C sur l’entremet congelé (peut être mis au frais entre temps)"
