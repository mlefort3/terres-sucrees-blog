name: "Glaçage"
description: "Glaçage crémeux au cream cheese vegan pour carrot cake"
ingredients:
  - item: "120 g de margarine"
  - item: "150 g de sucre glace"
  - item: "120 g de cream cheese vegan (j'ai utilisé le le p'tit frais nature de la marque morice)"
  - item: "1 c. à café d'extrait de vanille"
  - item: "1 c. à café de jus de citron"
steps:
  - "Fouetter la margarine jusqu’à ce qu’elle soit légère et mousseuse"
  - "Ajouter le cream cheese et bien mélanger"
  - "Ajouter le sucre glace tamisé et bien mélanger"
  - "Ajouter la vanille et le jus de citron et mélanger"
  - "Placer au frais 15–20 min pour qu’il se raffermisse avant de glacer le carrot cake"
