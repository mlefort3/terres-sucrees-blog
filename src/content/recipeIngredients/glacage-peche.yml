name: "Glaçage pêche"
description: "Glaçage au chocolat blanc et à la purée de pêche"
source: "Matteo Deiana (Giardino), magazine Fou de Pâtisserie n°71"
ingredients:
  - item: "200 g de chocolat blanc vegan"
  - item: "20 g de purée de pêche"
  - item: "20 g d’huile de pépins de raisins"
steps:
  - "Faire fondre le chocolat blanc au bain marie"
  - "Ajouter la purée de pêche et mélanger"
  - "Ajouter l’huile de pépins de raisins et mélanger"
  - "Verser à 35-40°C sur l'entremet congelé (peut être mis au frais entre temps)"
