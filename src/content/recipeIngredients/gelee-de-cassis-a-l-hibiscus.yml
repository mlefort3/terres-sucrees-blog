name: "Gelée de cassis à l'hibiscus"
category: insert
description: "Gelée de cassis parfumée à l'infusion d'hibiscus"
ingredients:
  - item: "200 g de purée de cassis"
  - item: "100 ml d'infusion d'hibiscus (2 c. à soupe de fleurs séchées pour 100 ml d'eau)"
  - item: "30 g de sucre"
  - item: "3 g de pectine NH"
  - item: "1 c. à café de jus de citron"
steps:
  - "Faire chauffer 100 ml d'eau, ajouter les fleurs d'hibiscus et laisser infuser 10 minutes"
  - "Filtrer et réserver"
  - "Chauffer la purée de cassis avec l'infusion d'hibiscus et le jus de citron à feu doux"
  - "Mélanger le sucre et la pectine NH"
  - "Verser en pluie sur la purée chaude en mélangeant bien"
  - "Porter à ébullition pendant 1 à 2 minutes en remuant"
  - "Verser dans votre moule à insert"
