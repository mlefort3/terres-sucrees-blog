name: "Croissant bicolore - Base"
category: autre
description: "Pâte à croissant à tourer, pour croissant bicolore"
source: "Fou de Pâtisserie, n° 68, croissants bicolores"
ingredients:
  - item: "250 g de farine de gruau"
  - item: "250 g de farine T55"
  - item: "55 g de sucre"
  - item: "9 g de sel fin"
  - item: "20 g de levure fraîche de boulanger"
  - item: "50 g de beurre vegan"
  - item: "255 g de lait de soja froid"
  - item: "300 g de beurre vegan de tourage (j'utilise Be Better)"
flavor:
  - neutre
  - beurre
steps:
  - "Dans la cuve d'un robot, ajouter les farines."
  - "Ajouter d'un côté le sel, le sucre et le beurre vegan en morceaux."
  - "D'un autre côté, ajouter la levure fraîche en morceaux."
  - "Ajouter le lait."
  - "Pétrir 6 min à vitesse minimum."
  - "Pétrir 4 min en 2ème vitesse."
  - "La pâte doit pouvoir s'étirer sans se casser. Si ce n'est pas le cas, remettre 2min et vérifier à nouveau jusqu'à obtention de la consistance souhaitée."
  - "Laisser 45 min à température ambiante, puis dégazer la pâte."
  - "Pendant ce temps là, étaler le beurre de tourage végétal dans un carré de papier sulfurisé d'environ 25x25 cm, puis laisser reposer au froid."
  - "Laisser refroidir la pâte à croissant dégazée 1h30 au réfrigérateur."
  - "Une fois la pâte et le beurre de tourage végétal refroidis, étaler la pâte sur un rectangle d'environ 50x25 cm (la pâte doit faire la même largeur que la pâte et 2x la longueur)."
  - "Enfermer le beurre dans la pâte."
  - "Filmer le tout et laisser refroidir 1h30 au réfrigérateur."
  - "Étaler la pâte dans le sens de la longueur (la pliure de la pâte étant à droite) pour une épaisseur assez fine et une longueur égale à 3x la largeur, et réaliser un tour double."
  - "Filmer le tout et laisser refroidir 1h30 au réfrigérateur."
  - "Étaler la pâte dans le sens de la longueur (la pliure de la pâte étant à droite) pour une épaisseur assez fine et une longueur égale à 2x la largeur, et réaliser un tour simple."
  - "Filmer le tout et laisser refroidir 2h au réfrigérateur avant utilisation."