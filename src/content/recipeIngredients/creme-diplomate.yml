name: "Crème diplomate"
description: "Crème diplomate vegan à la vanille, légère et onctueuse"
source:
  title: "Perle en Sucre"
  url: "https://perleensucre.com/creme-diplomate-ou-creme-legere-vegan/"
ingredients:
  - item: "250 ml de lait de soja"
  - item: "Une gousse de vanille"
  - item: "1,5 g d'agar-agar"
  - item: "10 mL d'eau froide"
  - item: "50 g de sucre"
  - item: "25 g de fécule de maïs"
  - item: "150 ml de crème végétale (30% de matières grasses)"
steps:
  - "Mélanger l'agar-agar et l'eau"
  - "Dans une casserole, mélanger le lait, le mélange eau+agar-agar, les grains de la gousse et la gousse grattée"
  - "Porter le tout à ébullition"
  - "Retirer du feu, laisser infuser 30 minutes et retirer la gousse de vanille"
  - "Dans un autre récipient, mélanger le sucre et la fécule"
  - "Ajouter petit à petit le lait à la vanille, en fouettant en continu"
  - "Une fois le lait ajouté et mélangé, reverser le tout dans la casserole"
  - "Faire cuire tout en fouettant jusqu'à épaississement de la crème (et elle doit bouillir au moins 1 min)"
  - "Retirer du feu, transvaser la crème dans un récipient et filmer au contact jusqu'à refroidissement"
  - "Une fois la crème refroidie, fouetter jusqu'à ce qu'elle redevienne souple"
  - "Monter la crème végétale en chantilly"
  - "Ajouter 1/4 de la crème fouettée à la crème à la vanille et fouetter rapidement pour détendre le tout"
  - "Ensuite, ajouter le reste de crème fouettée et mélanger délicatement à la maryse"
  - "Réserver"
