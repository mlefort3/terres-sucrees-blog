name: "Ganache montée chocolat noir"
category: mousse
description: "Ganache montée au chocolat noir et au sirop de glucose"
source: "YouTube Upfield Professional FR (Flora)"
ingredients:
  - item: "200 g de crème végétale liquide à 30% de matières grasses (1)"
  - item: "20 g de sirop de glucose"
  - item: "200 g de chocolat noir"
  - item: "600 g de crème végétale liquide à 30% de matières grasses (2)"
steps:
  - "Porter à l’ébullition la crème (1) et le sirop de glucose"
  - "Verser sur le chocolat noir"
  - "Attendre quelques minutes et mélanger le tout pour un mélange homogène"
  - "Ajouter la crème (2) et bien mélanger"
  - "Laisser refroidir plusieurs heures au réfrigérateur"
  - "Monter la ganache jusqu’à obtenir la texture souhaitée"
