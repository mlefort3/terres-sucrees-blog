name: "Glaçage jaune"
description: "Nappage miroir jaune pour entremets"
source: "Inspiré de La Pâte de Dom et d'une fiche pratique de l'Académie de Versailles"
notes: "Peut aussi être réalisé avec un nappage miroir tout prêt additionné de colorant jaune."
ingredients:
  - item: "250 g d'eau"
  - item: "10 g de pectine NH"
  - item: "62 g de sucre (1)"
  - item: "200 g de sucre (2)"
  - item: "16 g de sirop de glucose"
  - item: "Colorant jaune (quantité souhaitée)"
steps:
  - "Mélanger le sucre (1) et la pectine NH"
  - "Mettre l'eau à chauffer"
  - "Une fois l'eau tiède, ajouter le mélange sucre/pectine et mélanger le tout"
  - "Ajouter le sucre (2) et le glucose et mélanger le tout"
  - "Ajouter le colorant et mélanger"
  - "Porter à ébullition pour 2min"
  - "Laisser tiédir à environ 35°C avant de glacer l’entremet surgelé"
