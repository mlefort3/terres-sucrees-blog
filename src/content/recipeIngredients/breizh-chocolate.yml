name: "Breizh chocolate"
category: biscuit
description: "Tablette de chocolat noir garnie façon chocolat de Dubaï, version bretonne"
source:
  title: "Journal des Femmes"
  url: "https://cuisine.journaldesfemmes.fr/recette/3217394-tablette-de-chocolat-de-dubai"
ingredients:
  - item: "100 g de crêpes dentelles vegan"
  - item: "100 g de chocolat blanc vegan (1)"
  - item: "220 g de chocolat noir"
  - item: "70 g de caramel beurre salé vegan"
  - item: "2 cuillères à soupe de praliné amandes/sarrasin"
  - item: "20 g de margarine"
steps:
  - "Faire fondre le chocolat blanc (1)"
  - "Ajouter les crêpes dentelles en morceaux et mélanger"
  - "Ajouter le praliné et mélanger"
  - "Ajouter le caramel et mélanger"
  - "Ajouter la margarine fondue, mélanger et réserver"
  - "Faire fondre (ou tempérer) le chocolat noir"
  - "Étaler le chocolat dans le fond du moule"
  - "Mettre 3 min au congélateur"
  - "Ajouter la garniture réalisée dans les premières étapes"
  - "Rajouter par dessus le reste du chocolat noir et lisser le tout"
  - "Laisser refroidir au réfrigérateur"
