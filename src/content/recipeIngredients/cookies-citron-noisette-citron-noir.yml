name: "Cookies citron, noisette et citron noir"
description: "Cookies moelleux au citron, à la noisette et au citron noir"
ingredients:
  - item: "120 g de beurre végétal"
  - item: "80 g de cassonade"
  - item: "10 g de sirop d'agave"
  - item: "75 g de yaourt de soja"
  - item: "5 g extrait de vanille"
  - item: "210 g de farine T55"
  - item: "20 g de fécule de maïs"
  - item: "4 g de levure chimique"
  - item: "1 pincée de sel"
  - item: "Zeste de deux citrons"
  - item: "3 g de poudre de citron noir (facultatif)"
  - item: "50 g de noisettes en morceaux"
  - item: "80 g de pépites de chocolat au lait vegan (j'utilise le “MLK” de Linnolat)"
steps:
  - "Si souhaité, faire torréfier les noisettes"
  - "Mélanger la margarine molle (pommade) avec la cassonade et le sirop d'agave"
  - "Ajouter le yaourt, la vanille et mélanger"
  - "Ajouter la farine, la fécule, la levure, le sel, et mélanger"
  - "Ajouter le zeste des citrons, la poudre de citron noir, et mélanger"
  - "Ajouter les pépites de chocolat et les noisettes en morceaux"
  - "Laisser reposer 45 min au froid"
  - "Former des boules d'environ 80-90 g"
  - "Faire cuire 15 minutes à 180°C"
  - "Si souhaité, ajouter de la pâte de noisette et des zestes de citron sur le dessus en sortie de cuisson"
