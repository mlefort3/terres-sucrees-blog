name: "Ganache montée au praliné noix de pécan"
description: "Ganache montée au chocolat blanc et praliné de noix de pécan"
source:
  title: "l'Atelier du chocolat"
  url: "https://www.atelierduchocolat.fr/fr/recettes-et-conseils-chocolates/26-ganache-chocolat-blanc-montee-au-praline"
ingredients:
  - item: "220 g de chocolat blanc vegan"
  - item: "100 g de praliné noix de pécan"
  - item: "200 g de crème végétale liquide (1)"
  - item: "200 g de crème végétale liquide (2)"
  - item: "10 g de sucre"
  - item: "3 g de pectine NH"
steps:
  - "Mélanger le sucre et la pectine"
  - "Mettre à chauffer la crème (1)"
  - "Ajouter le mélange sucre/pectine NH et bien mélanger"
  - "Porter à ébullition pour 1-2 min"
  - "Verser sur le chocolat blanc en morceaux"
  - "Laisser fondre le chocolat dans la crème puis mélanger pour obtenir un mélange homogène"
  - "Ajouter la crème (2) et bien mélanger"
  - "Laisser reposer plusieurs heures (6-8h) au froid"
  - "Monter la ganache jusqu'à obtenir la consistance désirée"
