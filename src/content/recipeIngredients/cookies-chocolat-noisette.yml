name: "Cookies chocolat noisette"
description: "Cookies moelleux au chocolat et à la noisette"
ingredients:
  - item: "120 g de margarine végétale"
  - item: "80 g de cassonade"
  - item: "10 g de sirop d’agave"
  - item: "75 g de yaourt de soja"
  - item: "1 c. à café d'extrait de vanille"
  - item: "210 g de farine T55"
  - item: "20 g de fécule de maïs"
  - item: "4 g de levure chimique (poudre à lever)"
  - item: "1 pincée de sel"
  - item: "80 g de pépites de chocolat"
  - item: "50 g de noisettes concassées"
steps:
  - "Si souhaité, faire torréfier les noisettes"
  - "Mélanger la margarine molle (pommade) avec la cassonade et le sirop d'agave"
  - "Ajouter le yaourt, la vanille et mélanger"
  - "Ajouter la farine, la fécule, la levure, le sel, et mélanger"
  - "Ajouter les pépites chocolat et les noisettes en morceaux"
  - "Laisser reposer 45 min au froid"
  - "Former des boules d'environ 90 g"
  - "Faire cuire 15 minutes à 180°C"
  - "Si souhaité, ajouter du praliné sur le dessus en sortie de cuisson"
