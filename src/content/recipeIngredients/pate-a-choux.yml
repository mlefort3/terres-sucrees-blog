name: "Pâte à choux"
category: autre
description: "Pâte à choux vegan garnie d'amandes effilées"
source:
  title: "Patate & Cornichon"
  url: "https://www.youtube.com/watch?v=W1DhxD3gdBo"
ingredients:
  - item: "20 g de fécule de pomme de terre"
  - item: "80 mL d'eau (1)"
  - item: "120 mL de crème de soja"
  - item: "150 mL d'eau (2)"
  - item: "30 g de margarine"
  - item: "2 cuillère à soupe de cassonade"
  - item: "1 grosse pincée de sel"
  - item: "120 g de farine"
  - item: "2 cuillère à café de poudre à lever (ou levure chimique)"
  - item: "Quelques amandes effilées"
steps:
  - "Ajouter dans une casserole l'eau (1), la fécule de pomme de terre, et la crème de soja"
  - "Mélanger et mettre à chauffer jusqu'à épaississement"
  - "Mettre de côté dans un autre récipient, vous avez votre substitut d'oeuf"
  - "Dans une autre casserole, mettre l'eau (2), la margarine, la cassonade et le sel"
  - "Mélanger et porter le tout à ébullition"
  - "Hors du feu, ajouter la farine en une seule fois"
  - "Mélanger jusqu'à obtenir un mélange homogène"
  - "Remettre rapidement sur le feu tout en mélangeant, pour sécher un peu le tout"
  - "Mettre dans la cuve d'un batteur"
  - "Battre le tout pour refroidir la préparation, puis ajouter le substitut d'oeuf que vous avez préparé"
  - "Continuer à battre pour obtenir un mélange homogène"
  - "Ajouter la poudre à lever"
  - "Continuer à battre pour obtenir un mélange homogène"
  - "La pâte à choux est prête à être utilisée, vous pouvez la pocher selon la forme souhaitée (ici, un cercle)"
