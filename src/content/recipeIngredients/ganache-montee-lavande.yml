name: "Ganache montée lavande"
category: mousse
description: "Ganache montée au chocolat blanc infusée à la lavande"
source: "Myriam Sabet, revue Fou de Pâtisserie n°70"
notes: "Pour une autre version, vous pouvez aussi vous inspirer de la recette de ganache montée de mon entremet framboise citron vert, en remplaçant le citron vert par la lavande."
ingredients:
  - item: "207 g de crème végétale liquide (1)"
  - item: "2,5 g de pectine 325NH95 (ou autre pectine)"
  - item: "15 g de sirop de glucose"
  - item: "1 pincée de sel"
  - item: "Quelques brins de lavande (selon goût)"
  - item: "Colorant violet (facultatif)"
  - item: "82 g de chocolat blanc"
  - item: "207 g de crème végétale liquide (2)"
steps:
  - "Mixer ensemble la pectine et la crème (1)"
  - "Ajouter la lavande"
  - "Porter le tout à ébullition"
  - "Hors du feu, laisser infuser 10 min"
  - "Ajouter le sirop de glucose et le sel"
  - "Reporter le tout à ébullition"
  - "Verser sur le chocolat blanc en morceau et laisser le fondre"
  - "Ajouter la crème (2) et mixer le tout"
  - "Ajouter le colorant jusqu’à obtenir la couleur désirée"
  - "Laisser reposer au frais pour au moins 6 à 8 heures"
  - "Une fois bien refroidie, monter la crème à l’aide d’un batteur"
