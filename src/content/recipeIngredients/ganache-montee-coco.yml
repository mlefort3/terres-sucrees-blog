name: "Ganache montée à la noix de coco"
category: mousse
description: "Ganache montée au chocolat blanc et à la noix de coco"
source:
  title: "Sweetly Cakes"
  url: "https://sweetlycakes.com/ganache-coco/"
ingredients:
  - item: "200 g de chocolat blanc végétal"
  - item: "120 ml de crème végétale (1)"
  - item: "120 ml de crème végétale (2)"
  - item: "100 ml de crème de coco"
steps:
  - "Porter à l'ébullition la crème (1)"
  - "Verser sur le chocolat blanc en morceaux"
  - "Attendre quelques minutes et mélanger le tout pour un mélange homogène"
  - "Ajouter la crème (2), la crème de coco et bien mélanger"
  - "Laisser refroidir plusieurs heures au réfrigérateur"
  - "Monter la ganache jusqu'à obtenir la texture souhaitée"
