name: "Compotée fraise-rhubarbe"
category: insert
description: "Compotée fraise-rhubarbe légèrement acidulée"
source:
  title: "Aurélien Cohen"
  url: "https://www.aureliencohen.fr/2020/06/01/tarte-fraises-rhubarbe/"
ingredients:
  - item: "265 g de rhubarbe"
  - item: "36 g de sucre"
  - item: "20 g de margarine"
  - item: "20 g de sirop d'agave"
  - item: "200 g de purée de fraises"
  - item: "11 g de jus de citron"
  - item: "30 g de sucre (1)"
  - item: "12 g de sucre (2)"
  - item: "5,5 g de pectine NH"
steps:
  - "Laver, peler et couper en tronçons la rhubarbe"
  - "Mettre les tronçons de rhubarbe au fond d'un récipient, ajouter le sucre et mélanger avec les mains (facultatif)"
  - "Filmer le récipient et laisser dégorger une nuit au réfrigérateur (facultatif)"
  - "Le lendemain, égoutter la rhubarbe"
  - "Mettre dans une casserole la rhubarbe, le sirop d'agave et la margarine"
  - "Faire compoter à feu doux jusqu'à ce que toute l'eau soit évaporée"
  - "Ajouter la purée de fraises, le jus de citron et le sucre (1) dans une casserole"
  - "Ajouter la compotée de rhubarbe préparée préalablement"
  - "Dans un bol, mélanger le sucre (2) et la pectine NH"
  - "Faire chauffer le mélange fraise/rhubarbe"
  - "Ajouter le mélange sucre/pectine"
  - "Porter le tout à ébullition pour 1 min"
  - "Mixer le tout"
  - "Retirer du feu, réserver en filmant au contact"
