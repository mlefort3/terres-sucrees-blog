name: "Ganache montée pistache"
description: "Ganache montée au chocolat blanc et à la pistache"
ingredients:
  - item: "140 g de chocolat blanc vegan"
  - item: "40 g de pâte (ou crème) de pistache"
  - item: "250 mL de crème liquide végétale (1)"
  - item: "250 mL de crème liquide végétale (2)"
  - item: "5 g de pectine NH"
  - item: "10 g de sucre"
steps:
  - "Mélanger ensemble le sucre et la pectine"
  - "Faire chauffer la crème végétale (1)"
  - "Ajouter le mélange sucre/pectine"
  - "Porter le tout à ébullition"
  - "Verser sur le chocolat blanc en morceau et laisser le fondre"
  - "Mélanger le tout"
  - "Ajouter la crème (2) et la pistache, et mélanger ou mixer le tout"
  - "Laisser reposer au frais pour au moins 6 à 8 heures"
  - "Une fois bien refroidie, monter la crème à l’aide d’un batteur"
