name: "Caramel beurre salé"
category: insert
description: "Caramel beurre salé onctueux, adapté en version vegan"
notes: "Variante Oh Faon : 45 g de sucre, 45 g de glucose, 65 g de crème, 20 g d'huile de coco. Variante caramel serré : 200 g de sucre, 120 g de crème végétale (au lieu de 300 g), 40 g de margarine (type Flora), 2 g de sel."
source: "Arts et Gastronomie (Mille-feuille mousse caramel beurre salé)"
ingredients:
  - item: "200 g de sucre"
  - item: "300 g de crème végétale liquide"
  - item: "50 g de margarine"
flavor:
  - caramel
steps:
  - "Réaliser un caramel à sec avec le sucre"
  - "Ajouter la crème végétale liquide chaude et mélanger"
  - "Mélanger et laisser refroidir"
  - "Ajouter le beurre, mixer et réserver au frais"
