name: "Crème au mascarpone"
category: mousse
description: "Crème au mascarpone vegan façon tiramisù"
source:
  title: "Yumgo"
  url: "https://yumgo.fr/blogs/recettes/tiramisu?srsltid=AfmBOoqM6XSiD4ZdpV9a0RaoDOyE_RJe8OghIzsNkO3wcpxCSXVq6x6r"
ingredients:
  - item: "4,7 g de Yumgo Jaune"
  - item: "18,7 g de sucre (1)"
  - item: "81 g de lait de soja"
  - item: "9,4 g de margarine"
  - item: "250 g de mascarpone vegan"
  - item: "Arôme d'amande amère (facultatif)"
  - item: "12,5 g de sucre (2)"
  - item: "1,9 g de Yumgo Blanc en poudre"
  - item: "16,9 g d'eau (pour réhydrater le Yumgo Blanc)"
steps:
  - "Mélanger Yumgo Jaune poudre, le sucre et une partie du lait"
  - "Porter le reste du lait à ébullition"
  - "Ajouter une partie du lait chaud dans le mélange précédent, bien fouetter"
  - "Remettre le tout dans la casserole et cuire jusqu'à ébullition"
  - "Hors du feu, ajouter la margarine et l'arôme d'amande amère"
  - "Mixer, filmer au contact et laisser au frais jusqu'à refroidissement"
  - "Une fois froid, mixer à nouveau, puis incorporer le mascarpone vegan"
  - "Réserver"
