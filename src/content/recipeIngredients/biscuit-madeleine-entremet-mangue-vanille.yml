name: "Biscuit madeleine"
description: "Biscuit madeleine vegan (pour une plaque 30×20 cm)"
ingredients:
  - item: "150 g de farine (T55)"
  - item: "20 g de fécule de maïs"
  - item: "100 g de sucre"
  - item: "8 g de levure chimique"
  - item: "1 pincée de sel"
  - item: "120 g de yaourt de soja"
  - item: "60 g de lait d’avoine"
  - item: "80 g de margarine fondue"
  - item: "1 c. à café d’extrait de vanille"
  - item: "1 c. à café de vinaigre de cidre"
steps:
  - "Préchauffer le four à 170°C (chaleur tournante)"
  - "Dans un bol, mélanger la farine, la fécule de maïs, le sucre, la levure chimique et le sel"
  - "Dans un autre bol, fouetter ensemble le yaourt végétal, le lait végétal, la margarine fondue, l’extrait de vanille, et le vinaigre de cidre"
  - "Verser les liquides dans les ingrédients secs."
  - "Mélanger doucement jusqu’à obtention d’une pâte lisse et homogène"
  - "Étaler la pâte uniformément (1 cm d’épaisseur) sur la plaque."
  - "Enfourner pour 12 à 15 minutes, jusqu’à ce que le biscuit soit doré et souple au toucher."
  - "Laisser refroidir"
  - "Réserver"
